<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>RepoLens</title>
<style>
:root{--bg:#eef2f5;--panel:#fff;--ink:#16222d;--mute:#5b6b7a;--line:#d5dde4;--teal:#0b6e6e;--teal-d:#084f4f;--hl:#fff1c2;--err:#a32626;--code:#f4f6f8}
@media (prefers-color-scheme:dark){:root{--bg:#10171d;--panel:#18222b;--ink:#e6edf3;--mute:#93a3b1;--line:#2b3a47;--teal:#4fc3c3;--teal-d:#8ae0e0;--hl:#4a3f12;--err:#ff8f8f;--code:#0f161c}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif}
header{padding:28px 24px 8px;max-width:1120px;margin:auto}
h1{margin:0;font-size:30px;letter-spacing:-.02em;font-family:ui-serif,Georgia,serif}
header p{margin:4px 0 0;color:var(--mute);max-width:60ch}
main{max-width:1120px;margin:16px auto 48px;padding:0 24px;display:grid;grid-template-columns:minmax(0,5fr) minmax(0,7fr);gap:20px}
@media(max-width:820px){main{grid-template-columns:1fr}}
section{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:20px}
h2{margin:0 0 12px;font-size:17px}
form{display:flex;gap:8px;flex-wrap:wrap}
input[type=text]{flex:1 1 220px;padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);font:inherit}
button{padding:10px 14px;border-radius:8px;border:1px solid var(--teal);background:var(--teal);color:#fff;font:inherit;cursor:pointer}
body button{color:#fff}@media (prefers-color-scheme:dark){button{color:#08201f}}
button.ghost{background:transparent;color:var(--teal-d)!important}
button:disabled{opacity:.5;cursor:wait}
:focus-visible{outline:3px solid var(--teal);outline-offset:2px}
.hint{color:var(--mute);font-size:14px;margin:10px 0 0}
.err{color:var(--err);background:color-mix(in srgb,var(--err) 10%,transparent);padding:10px 12px;border-radius:8px;margin-top:12px;display:none}
.err button{margin-left:8px;padding:4px 10px}
.pill{display:inline-block;padding:2px 10px;border:1px solid var(--line);border-radius:99px;font-size:14px;margin:0 6px 6px 0}
code,pre{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:13px}
.files{margin:6px 0 0;padding:0;list-style:none}.files li{padding:2px 0}
.tag{font-size:13px;color:var(--mute);margin-top:12px}
#ov{display:none}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 14px}
.msg{border-top:1px solid var(--line);padding:14px 0}
.q{font-weight:600}
.a{white-space:pre-wrap;margin:6px 0 0}
details{margin-top:8px;border:1px solid var(--line);border-radius:8px;background:var(--code)}
summary{cursor:pointer;padding:8px 10px;font-family:ui-monospace,Menlo,monospace;font-size:13px}
pre{margin:0;padding:10px;overflow-x:auto;background:var(--hl);color:var(--ink)}
.mode{font-size:13px;color:var(--mute);margin-top:6px}
.spin{display:inline-block;width:14px;height:14px;border:2px solid var(--line);border-top-color:var(--teal);border-radius:50%;animation:s .8s linear infinite;vertical-align:-2px;margin-right:6px}
@keyframes s{to{transform:rotate(360deg)}}@media(prefers-reduced-motion:reduce){.spin{animation:none}}
</style>
</head>
<body>
<header>
  <h1>RepoLens</h1>
  <p>Understand any public codebase in minutes, with answers tied to the actual source files.</p>
</header>
<main>
  <div>
    <section>
      <h2>Choose a repository</h2>
      <form id="load">
        <input type="text" id="url" placeholder="https://github.com/owner/repo" aria-label="GitHub repository URL">
        <button id="go">Analyze repository</button>
        <button type="button" class="ghost" id="sample">Load sample repository</button>
      </form>
      <p class="hint" id="status"></p>
      <div class="err" id="loadErr" role="alert"></div>
    </section>
    <section id="ov" style="margin-top:20px">
      <h2 id="ovName"></h2>
      <p id="ovSummary" style="margin:0"></p>
      <p class="tag" id="ovSrc"></p>
      <h2 style="margin-top:16px">Stack</h2><div id="ovStack"></div>
      <h2 style="margin-top:8px">Key files</h2><ul class="files" id="ovFiles"></ul>
      <p class="hint" id="ovCount"></p>
    </section>
  </div>
  <section>
    <h2>Ask about the code</h2>
    <div class="chips" id="chips"></div>
    <form id="ask">
      <input type="text" id="q" placeholder="Load a repository first" aria-label="Your question" disabled maxlength="500">
      <button id="askBtn" disabled>Ask</button>
    </form>
    <div class="err" id="askErr" role="alert"></div>
    <div id="log"><p class="hint">Answers appear here with the file excerpts they came from. If the files don't contain the answer, RepoLens says so.</p></div>
  </section>
</main>
<script>
const $=id=>document.getElementById(id);
let sid=null,lastQ="";
const QS=["What does this project do, and what technologies does it use?","Where is the main application entry point, and what happens when the app starts?","How do I run this project locally?"];
function el(tag,text,cls){const e=document.createElement(tag);if(text!=null)e.textContent=text;if(cls)e.className=cls;return e}
function showErr(box,msg,retry){box.textContent=msg;box.style.display="block";if(retry){const b=el("button","Retry","ghost");b.type="button";b.onclick=retry;box.append(b)}}
async function api(path,body){
  const r=await fetch(path,{method:body?"POST":"GET",headers:{"Content-Type":"application/json"},body:body?JSON.stringify(body):undefined});
  const j=await r.json().catch(()=>({}));
  if(!r.ok)throw new Error(j.detail||"Something went wrong. Try again.");
  return j;
}
function setStatus(s){$("status").textContent=s.provider==="snowflake"?`AI: Snowflake Cortex, model ${s.model}`:"AI: offline mode. Snowflake credentials are not set, so answers show matching excerpts without a model."}
api("/api/status").then(setStatus).catch(()=>{});
async function analyze(payload){
  $("loadErr").style.display="none";
  const btns=document.querySelectorAll("#load button");btns.forEach(b=>b.disabled=true);
  $("status").replaceChildren(el("span","","spin"),document.createTextNode("Reading repository files..."));
  try{
    const d=await api("/api/analyze",payload);
    sid=d.session_id;setStatus(d);render(d);
  }catch(e){showErr($("loadErr"),e.message,()=>analyze(payload));api("/api/status").then(setStatus)}
  btns.forEach(b=>b.disabled=false);
}
function render(d){
  const o=d.overview;$("ov").style.display="block";
  $("ovName").textContent=d.name;$("ovSummary").textContent=o.summary;
  $("ovSrc").textContent=o.summary_source==="model"?`Summary written by ${d.model} from the README and file list. Verify against the files.`:"Summary is the opening of the README, not model-generated.";
  $("ovStack").replaceChildren(...(o.stack.length?o.stack:["Not detected"]).map(s=>el("span",s,"pill")));
  $("ovFiles").replaceChildren(...o.key_files.map(f=>el("li",f)));
  $("ovFiles").querySelectorAll("li").forEach(li=>{const c=el("code",li.textContent);li.replaceChildren(c)});
  $("ovCount").textContent=`${o.file_count} files indexed, ${o.skipped} skipped (binary, dependencies, secrets, or over size limits).`;
  $("q").disabled=$("askBtn").disabled=false;$("q").placeholder="Ask a question about this repository";
  $("chips").replaceChildren(...QS.map(t=>{const b=el("button",t,"ghost");b.type="button";b.onclick=()=>{$("q").value=t;ask(t)};return b}));
  $("log").replaceChildren();
}
async function ask(q){
  $("askErr").style.display="none";lastQ=q;
  const m=el("div",null,"msg");m.append(el("div",q,"q"));
  const a=el("div",null,"a");a.append(el("span","","spin"),document.createTextNode("Searching files..."));m.append(a);
  $("log").prepend(m);$("askBtn").disabled=true;
  try{
    const d=await api("/api/ask",{session_id:sid,question:q});
    a.textContent=d.answer;
    d.sources.forEach(s=>{const det=el("details");det.append(el("summary",`${s.path}:${s.start}-${s.end}`));det.append(el("pre",s.excerpt));m.append(det)});
    if(d.mode==="offline")m.append(el("div","Offline mode: no model was called.","mode"));
  }catch(e){m.remove();showErr($("askErr"),e.message,()=>ask(q))}
  $("askBtn").disabled=false;
}
$("load").onsubmit=e=>{e.preventDefault();analyze({url:$("url").value})};
$("sample").onclick=()=>analyze({sample:true});
$("ask").onsubmit=e=>{e.preventDefault();const q=$("q").value.trim();if(q){ask(q);$("q").value=""}};
</script>
</body>
</html>
